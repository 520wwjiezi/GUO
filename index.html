                <img src="Image.png" alt="贵州市职业学院学生会">
            </div>
            <div class="letter">
                <!-- 小国旗 -->
                <div class="mini-flag-deco">
                    <div class="mini-flag-body">
                        <svg class="flag-star-big" viewBox="0 0 24 24" fill="#ffde00">
                            <path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/>
                        </svg>
                    </div>
                </div>
                <div class="letter-content" id="textArea">
                    <p class="salutation">瞿老师：</p>
                    <p>京华秋意浓，举国同庆时。</p>
                    <p>欣闻您在北京进修学习，</p>
                    <p>值此国庆佳节，</p>
                    <p>遥寄一份祝福与思念。</p>
                    <p>愿山河锦绣，国泰民安；</p>
                    <p>愿您学有所成，身体康健，</p>
                    <p>桃李满天下，万事皆顺意。</p>
                    <p class="signature">学生 敬上</p>
                    <p class="date">二〇二六年十月一日 于国庆</p>
                </div>
                <!-- 印章 -->
                <div class="letter-seal">
                    <div class="letter-seal-inner">恭贺<br>国庆</div>
                </div>
            </div>
        </div>
    </button>

    <div class="ribbon">欢度国庆</div>

    <div class="tip">
        <span class="tip-icon">👆</span>
        点击信封拆阅信件 · 再次点击合上
    </div>
</div>

<script>
(function(){
    'use strict';

    function debounce(fn, delay) {
        let timer;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }
    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    // ===== 飘落粒子 =====
    const particleCanvas = document.getElementById('particleCanvas');
    const pCtx = particleCanvas.getContext('2d');
    let particles = [];

    function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
    }
    resizeParticleCanvas();
    window.addEventListener('resize', debounce(resizeParticleCanvas, 100));

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
            rot += step;
            ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
    }

    function drawMiniFlag(ctx, size) {
        ctx.fillStyle = '#de2910';
        ctx.fillRect(-size/2, -size*0.35, size, size*0.7);
        ctx.fillStyle = '#ffde00';
        const starSize = size * 0.22;
        drawStar(ctx, -size * 0.28, -size * 0.12, 5, starSize, starSize * 0.4);
        const smallStarSize = size * 0.08;
        const stars = [
            { x: -size*0.06, y: -size*0.25 },
            { x: 0, y: -size*0.15 },
            { x: 0, y: -size*0.02 },
            { x: -size*0.06, y: size*0.08 }
        ];
        stars.forEach(s => drawStar(ctx, s.x, s.y, 5, smallStarSize, smallStarSize * 0.4));
    }

    class FallParticle {
        constructor() { this.reset(); }
        reset() {
            this.x = random(0, particleCanvas.width);
            this.y = random(-60, -10);
            this.size = random(6, 20);
            this.speedY = random(0.4, 1.4);
            this.speedX = random(-0.5, 0.5);
            this.rotate = random(0, Math.PI * 2);
            this.rotateSpeed = random(-0.03, 0.03);
            this.swingSpeed = random(0.008, 0.02);
            this.swingOffset = random(0, Math.PI * 2);
            this.alpha = random(0.5, 0.9);
            const rand = Math.random();
            if (rand < 0.3) this.type = 'star';
            else if (rand < 0.55) this.type = 'flag';
            else if (rand < 0.8) this.type = 'sparkle';
            else this.type = 'heart';
        }
        update(time) {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(time * this.swingSpeed + this.swingOffset) * 0.4;
            this.rotate += this.rotateSpeed;
            if (this.y > particleCanvas.height + 50) this.reset();
        }
        draw() {
            pCtx.save();
            pCtx.globalAlpha = this.alpha;
            pCtx.translate(this.x, this.y);
            pCtx.rotate(this.rotate);
            switch (this.type) {
                case 'star':
                    pCtx.fillStyle = '#ffde00';
                    pCtx.shadowColor = '#ffde00';
                    pCtx.shadowBlur = 12;
                    drawStar(pCtx, 0, 0, 5, this.size, this.size * 0.42);
                    break;
                case 'flag':
                    pCtx.shadowColor = '#de2910';
                    pCtx.shadowBlur = 6;
                    drawMiniFlag(pCtx, this.size * 1.8);
                    break;
                case 'sparkle':
                    pCtx.fillStyle = '#fff8dc';
                    pCtx.shadowColor = '#ffd700';
                    pCtx.shadowBlur = 14;
                    pCtx.beginPath();
                    pCtx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2);
                    pCtx.fill();
                    break;
                case 'heart':
                    pCtx.fillStyle = '#ff6b6b';
                    pCtx.shadowColor = '#ff2d55';
                    pCtx.shadowBlur = 8;
                    drawHeart(pCtx, 0, 0, this.size);
                    break;
            }
            pCtx.restore();
        }
    }

    function drawHeart(ctx, x, y, size) {
        ctx.beginPath();
        const h = size * 0.3;
        ctx.moveTo(x, y + h);
        ctx.bezierCurveTo(x, y, x - size/2, y, x - size/2, y + h);
        ctx.bezierCurveTo(x - size/2, y + (size + h)/2, x, y + (size + h)/2, x, y + size);
        ctx.bezierCurveTo(x, y + (size + h)/2, x + size/2, y + (size + h)/2, x + size/2, y + h);
        ctx.bezierCurveTo(x + size/2, y, x, y, x, y + h);
        ctx.closePath();
        ctx.fill();
    }

    function initParticles(count = 55) {
        particles = [];
        for (let i = 0; i < count; i++) {
            const p = new FallParticle();
            p.y = random(0, particleCanvas.height);
            particles.push(p);
        }
    }
    function animateParticles(time) {
        pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        for (let p of particles) { p.update(time); p.draw(); }
        requestAnimationFrame(animateParticles);
    }
    initParticles();
    requestAnimationFrame(animateParticles);

    // ===== 烟花 =====
    const fireworkCanvas = document.getElementById('fireworkCanvas');
    const fCtx = fireworkCanvas.getContext('2d');
    let fireworks = [];
    let fireworkParticles = [];

    function resizeFireworkCanvas() {
        fireworkCanvas.width = window.innerWidth;
        fireworkCanvas.height = window.innerHeight;
    }
    resizeFireworkCanvas();
    window.addEventListener('resize', debounce(resizeFireworkCanvas, 100));

    class Firework {
        constructor(x, targetY, color) {
            this.x = x;
            this.y = fireworkCanvas.height;
            this.targetY = targetY;
            this.color = color;
            this.speed = random(6, 10);
            this.trail = [];
            this.trailLength = 10;
            this.exploded = false;
        }
        update() {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > this.trailLength) this.trail.shift();
            this.y -= this.speed;
            this.speed -= 0.08;
            if (this.y <= this.targetY || this.speed <= 0) {
                this.exploded = true;
                this.explode();
            }
        }
        explode() {
            const count = Math.floor(random(50, 80));
            const colors = ['#ffde00','#ffec8b','#daa520','#ff2d55','#de2910','#e63946','#fff8dc','#ffffff'];
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + random(-0.08, 0.08);
                const speed = random(2.5, 7);
                fireworkParticles.push({
                    x: this.x, y: this.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1, decay: random(0.01, 0.02),
                    size: random(1.5, 4), gravity: 0.04,
                    friction: 0.985, sparkle: Math.random() < 0.35
                });
            }
            for (let i = 0; i < 25; i++) {
                const angle = random(0, Math.PI * 2);
                const speed = random(1, 4);
                fireworkParticles.push({
                    x: this.x, y: this.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: Math.random() < 0.5 ? '#ffde00' : '#ff2d55',
                    alpha: 1, decay: random(0.015, 0.03),
                    size: random(2, 4.5), gravity: 0.06,
                    friction: 0.97, sparkle: true
                });
            }
            if (Math.random() < 0.5) {
                for (let i = 0; i < 15; i++) {
                    const angle = (Math.PI * 2 * i) / 15;
                    const speed = random(3, 5.5);
                    fireworkParticles.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: '#ffde00', alpha: 1, decay: 0.012,
                        size: random(2.5, 4.5), gravity: 0.03,
                        friction: 0.99, sparkle: true, isStar: true
                    });
                }
            }
        }
        draw() {
            fCtx.save();
            for (let i = 0; i < this.trail.length; i++) {
                const t = this.trail[i];
                fCtx.globalAlpha = i / this.trail.length * 0.5;
                fCtx.fillStyle = this.color;
                fCtx.beginPath();
                fCtx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
                fCtx.fill();
            }
            fCtx.globalAlpha = 1;
            fCtx.fillStyle = '#fff8dc';
            fCtx.shadowColor = this.color;
            fCtx.shadowBlur = 14;
            fCtx.beginPath();
            fCtx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
            fCtx.fill();
            fCtx.restore();
        }
    }

    function launchFirework(x, y) {
        const colors = ['#ffde00', '#ff2d55', '#daa520', '#de2910'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const targetY = y || random(fireworkCanvas.height * 0.1, fireworkCanvas.height * 0.4);
        const startX = x || random(fireworkCanvas.width * 0.15, fireworkCanvas.width * 0.85);
        fireworks.push(new Firework(startX, targetY, color));
    }

    function animateFireworks() {
        fCtx.globalCompositeOperation = 'destination-out';
        fCtx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        fCtx.fillRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
        fCtx.globalCompositeOperation = 'source-over';
        for (let i = fireworks.length - 1; i >= 0; i--) {
            fireworks[i].update();
            fireworks[i].draw();
            if (fireworks[i].exploded) fireworks.splice(i, 1);
        }
        for (let i = fireworkParticles.length - 1; i >= 0; i--) {
            const p = fireworkParticles[i];
            p.vy += p.gravity;
            p.vx *= p.friction;
            p.vy *= p.friction;
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) { fireworkParticles.splice(i, 1); continue; }
            fCtx.save();
            fCtx.globalAlpha = p.alpha;
            fCtx.fillStyle = p.color;
            fCtx.shadowColor = p.color;
            fCtx.shadowBlur = p.sparkle ? 12 : 7;
            if (p.isStar) {
                drawStar(fCtx, p.x, p.y, 5, p.size * 1.5, p.size * 0.6);
            } else {
                fCtx.beginPath();
                fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fCtx.fill();
            }
            fCtx.restore();
        }
        requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    // ===== 毛笔字 =====
    class BrushWriter {
        constructor(el, charSpeed = 55, lineDelay = 220) {
            this.el = el;
            this.charSpeed = charSpeed;
            this.lineDelay = lineDelay;
            this.isRunning = false;
        }
        async start(htmlStr) {
            if (this.isRunning) return;
            this.isRunning = true;
            this.el.innerHTML = '';
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlStr;
            const paras = [...tempDiv.querySelectorAll('p')];
            for (const p of paras) {
                const newP = document.createElement('p');
                if (p.className) newP.className = p.className;
                if (p.getAttribute('style')) newP.setAttribute('style', p.getAttribute('style'));
                newP.style.opacity = '1';
                newP.style.transform = 'translateY(0)';
                this.el.appendChild(newP);
                const text = p.innerText;
                for (let i = 0; i < text.length; i++) {
                    const span = document.createElement('span');
                    span.className = 'brush-char';
                    span.textContent = text[i];
                    newP.appendChild(span);
                    await this.sleep(this.charSpeed);
                }
                await this.sleep(this.lineDelay);
            }
            this.isRunning = false;
        }
        sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
        clear() { this.el.innerHTML = ''; }
    }

    // ===== 信封控制器 =====
    class EnvelopeController {
        constructor(wrapDom, containerDom, textDom, rawTextHtml) {
            this.wrap = wrapDom;
            this.container = containerDom;
            this.textArea = textDom;
            this.rawHtml = rawTextHtml;
            this.isOpen = false;
            this.isAnimating = false;
            this.brushWriter = new BrushWriter(textDom, 55, 200);
            this.bindEvents();
        }
        bindEvents() {
            this.wrap.addEventListener('click', () => this.toggle());
            this.wrap.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggle(); }
            });
        }
        async toggle() {
            if (this.isAnimating) return;
            this.isAnimating = true;
            if (!this.isOpen) {
                this.wrap.classList.add('open');
                this.container.classList.add('open');
                this.isOpen = true;
                setTimeout(() => { this.brushWriter.start(this.rawHtml); }, 900);
                this.launchCelebrationFireworks();
            } else {
                this.wrap.classList.remove('open');
                this.container.classList.remove('open');
                this.isOpen = false;
                this.brushWriter.clear();
            }
            setTimeout(() => { this.isAnimating = false; }, 1300);
        }
        launchCelebrationFireworks() {
            const waves = [0, 180, 360, 540, 720, 900, 1080];
            waves.forEach((delay, index) => {
                setTimeout(() => {
                    const count = index < 4 ? 2 : 1;
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => { launchFirework(); }, i * 90);
                    }
                }, delay + 500);
            });
        }
    }

    // 初始化
    const wrapEl = document.getElementById('wrap');
    const containerEl = document.getElementById('container');
    const textEl = document.getElementById('textArea');
    const originalContent = textEl.innerHTML;
    new EnvelopeController(wrapEl, containerEl, textEl, originalContent);

    // 自动放烟花
    setInterval(() => { if (Math.random() < 0.35) launchFirework(); }, 4000);

    // 金色闪烁
    function createSparkle() {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = random(0, 100) + '%';
        s.style.top = random(0, 100) + '%';
        s.style.animationDelay = random(0, 3) + 's';
        s.style.animationDuration = random(2, 4) + 's';
        document.body.appendChild(s);
    }
    for (let i = 0; i < 25; i++) createSparkle();
})();
</script>
</body>
